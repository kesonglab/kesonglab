name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "*.md"
          config: .markdownlint-cli2.jsonc